spring.application.name=eventify

# Configuracion de la aplicacion
server.port=8080

# Configuracion de seeders (desactivado - Flyway V3 maneja los datos semilla)
app.seed.enabled=false

# Configuracion de logging
logging.level.com.riwi.eventify=INFO

# Configuracion de base de datos H2
# AUTO_SERVER=TRUE permite multiples conexiones (IDE + Maven)
spring.datasource.url=jdbc:h2:file:./data/eventify;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA/Hibernate
# ddl-auto=none: Hibernate NO genera ni valida schema.
# El control total del schema se delega a Flyway.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Auditoria SQL: muestra los valores de parametros en consola (BasicBinder=TRACE)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Hibernate 6 usa este logger para los valores enlazados de parametros JDBC.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Configuracion de Flyway - control total de migraciones de BD
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Configuracion de consola H2 (opcional, para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
