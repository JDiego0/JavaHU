<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify - Formulario de Evento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input[type="text"],
        input[type="datetime-local"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .empty-venues {
            color: #721c24;
            background: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin-top: 8px;
        }
        .has-error input,
        .has-error textarea,
        .has-error select {
            border-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${event.id != null ? '✏️ Editar Evento' : '➕ Nuevo Evento'}">Nuevo Evento</h1>
        
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/admin/events/save}" th:object="${event}" method="post">
            <input type="hidden" th:field="*{id}" th:if="${event.id != null}" />
            
            <div class="form-group">
                <label for="name">Nombre del Evento *</label>
                <input type="text" id="name" th:field="*{name}" required maxlength="100" placeholder="Ej: Conferencia de Tecnología" />
                <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Nombre es requerido</div>
            </div>
            
            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" th:field="*{description}" maxlength="500" placeholder="Describe el evento..."></textarea>
                <div class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            
            <div class="form-group">
                <label for="date">Fecha y Hora *</label>
                <input type="datetime-local" id="date" th:field="*{date}" required />
                <div class="error-message" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Fecha es requerida</div>
            </div>
            
            <div class="form-group">
                <label for="venue">Lugar *</label>
                <select id="venue" th:field="*{venue}" required th:disabled="${venues == null or #lists.isEmpty(venues)}">
                    <option value="">Seleccione un lugar</option>
                    <option th:each="venueItem : ${venues}"
                            th:value="${venueItem.name}"
                            th:text="${venueItem.name + ' - Capacidad: ' + venueItem.capacity}">
                        Centro de Convenciones - Capacidad: 500
                    </option>
                </select>
                <div th:if="${venues == null or #lists.isEmpty(venues)}" class="empty-venues">
                    No hay lugares registrados. Registre un lugar antes de crear eventos.
                </div>
                <div class="error-message" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}">Lugar es requerido</div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Guardar</button>
                <a href="/admin/events" class="btn btn-secondary">❌ Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
